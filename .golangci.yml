version: "2"

linters:
  default: standard
  enable:
    - errname
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - perfsprint
    - revive
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usetesting
    - wrapcheck
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: early-return
        - name: unused-parameter
    wrapcheck:
      ignore-sig-regexps:
        - \.Errorf\(
        - errors\.New\(
        - errors\.Join\(
        - \(\*github\.com/spf13/cobra\.Command\)\.
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - wrapcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tedslittlerobot/svm
